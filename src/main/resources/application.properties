
# Server
server.port=${SERVER_PORT:8081}

# Datasource (use environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cinemaDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

upload.video=uploads/videos/
upload.poster=uploads/posters/
upload.banner=uploads/banners/
upload.trailer=uploads/trailers/


spring.jackson.serialization.fail-on-empty-beans=false

# Disable Open-In-View for safer transaction handling in production
spring.jpa.open-in-view=false

# JWT secret (override in production)
jwt.secret=${JWT_SECRET:FLOWFLIX_SECRET_KEY}

# Management / Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,threaddump
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# UPI payment configuration (set via env vars in production)
payment.upi.id=${PAYMENT_UPI_ID:}
payment.upi.name=${PAYMENT_UPI_NAME:FlowFlix}
