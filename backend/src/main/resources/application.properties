server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/cinemaDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

upload.video=uploads/videos/
upload.poster=uploads/posters/
upload.banner=uploads/banners/
upload.trailer=uploads/trailers/

spring.jackson.serialization.fail-on-empty-beans=false