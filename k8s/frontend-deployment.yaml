apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowflix-frontend
  labels:
    app: flowflix-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowflix-frontend
  template:
    metadata:
      labels:
        app: flowflix-frontend
    spec:
      containers:
        - name: frontend
          image: aakanksha0499/flowflix-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flowflix-frontend-service
spec:
  type: LoadBalancer       # use NodePort if on local cluster (minikube)
  selector:
    app: flowflix-frontend
  ports:
    - port: 80
      targetPort: 80
